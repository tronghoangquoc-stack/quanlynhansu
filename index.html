<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer Unit2 Group 3</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --brand: #155eef;
      --brand-2: #0e9384;
      --danger: #d92d20;
      --warn: #dc6803;
      --ok: #039855;
      --shadow: 0 10px 25px rgba(21, 32, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 10px rgba(21, 32, 51, .04);
    }
    .top-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 16px 10px;
      display: grid;
      gap: 12px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 20px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab {
      border: 1px solid var(--line);
      background: #fff;
      color: #344054;
      border-radius: 6px;
      padding: 9px 12px;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 16px 64px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
    }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: #344054;
      border-radius: 6px;
      min-height: 38px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.success { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
    .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
    .btn.sm { min-height: 30px; padding: 5px 8px; font-size: 13px; }
    .grid {
      display: grid;
      gap: 12px;
    }
    .stats {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 14px;
    }
    .stat, .panel, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .stat { padding: 14px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { font-size: 26px; font-weight: 800; margin-top: 4px; }
    .panel { padding: 14px; margin-bottom: 14px; }
    .panel-title {
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 980px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px;
      vertical-align: top;
      text-align: left;
      font-size: 13px;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f2f4f7;
      font-weight: 800;
    }
    td:first-child, th:first-child {
      position: sticky;
      left: 0;
      z-index: 3;
      background: #fff;
      min-width: 190px;
    }
    th:first-child { background: #f2f4f7; z-index: 4; }
    .emp-name { font-weight: 800; }
    .emp-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .day-cell {
      display: grid;
      gap: 4px;
      min-width: 132px;
      min-height: 92px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0;
      width: 100%;
    }
    .pill {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
    }
    .s-Onl { background: #039855; }
    .s-Home { background: #dc6803; }
    .s-Rest { background: #475467; }
    .s-PL, .s-AL, .s-VA { background: #155eef; }
    .s-BL, .s-PTL, .s-MTL, .s-ML { background: #7a5af8; }
    .s-AB { background: #d92d20; }
    .cell-line { color: #344054; font-size: 12px; }
    .cell-line.muted { color: var(--muted); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    label { display: grid; gap: 5px; color: #344054; font-size: 13px; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 84px; resize: vertical; }
    .list {
      display: grid;
      gap: 10px;
    }
    .card {
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .muted { color: var(--muted); }
    .score-pos { color: var(--ok); font-weight: 800; }
    .score-neg { color: var(--danger); font-weight: 800; }
    .summary-table { min-width: 720px; }
    .bar {
      height: 10px;
      background: #e4e7ec;
      border-radius: 999px;
      overflow: hidden;
      min-width: 100px;
    }
    .bar span { display: block; height: 100%; background: var(--brand-2); }
    dialog {
      width: min(720px, calc(100vw - 24px));
      border: 0;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 20px 60px rgba(21, 32, 51, .28);
    }
    dialog::backdrop { background: rgba(21, 32, 51, .42); }
    .modal-head, .modal-foot {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .modal-foot {
      border-bottom: 0;
      border-top: 1px solid var(--line);
      justify-content: flex-end;
    }
    .modal-body { padding: 14px; }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #172033;
      color: #fff;
      padding: 11px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .2s ease;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .auth-card {
      max-width: 460px;
      margin: 48px auto;
      padding: 18px;
    }
    .user-badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--muted);
      background: #fff;
      font-size: 13px;
    }
    .hidden { display: none !important; }
    @media (max-width: 760px) {
      .stats, .form-grid { grid-template-columns: 1fr; }
      .brand-row { align-items: flex-start; flex-direction: column; }
      main { padding-inline: 10px; }
      .top-inner { padding-inline: 10px; }
      td:first-child, th:first-child { min-width: 150px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand-row">
        <div>
          <h1>Transfer Unit2 Group 3</h1>
          <div class="subtitle">Shein - Kho BW Long An (Tây Ninh)</div>
        </div>
        <div class="toolbar" id="topActions" style="margin:0">
          <button class="btn success" onclick="exportExcel()">Xuất Excel</button>
          <button class="btn" onclick="exportBackup()">Sao lưu JSON</button>
          <button class="btn" onclick="document.getElementById('importFile').click()">Nhập JSON</button>
          <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importBackup(event)">
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>

  <main id="app"></main>

  <dialog id="modal">
    <div class="modal-head">
      <strong id="modalTitle"></strong>
      <button class="btn sm" onclick="closeModal()">Đóng</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </dialog>
  <div class="toast" id="toast"></div>

  <script>
    const TEAM = 'Transfer Unit2 Group 3';
    const STORE_KEY = 'tu2g3_management_v2';
    const SESSION_KEY = 'tu2g3_current_user';
    const tabs = [
      ['schedule', 'Lịch làm việc'],
      ['employees', 'Nhân sự'],
      ['activities', 'Hoạt động'],
      ['records', 'Ghi nhận'],
      ['reports', 'Báo cáo']
    ];
    const statuses = {
      Onl: 'Đi làm',
      Home: 'Nghỉ vượt',
      Rest: 'Nghỉ tuần',
      PL: 'Phép cá nhân',
      AL: 'Phép năm',
      BL: 'Phép tang',
      PTL: 'Nghỉ thai sản nam',
      MTL: 'Nghỉ thai sản nữ',
      ML: 'Nghỉ kết hôn',
      VA: 'Nghỉ lễ',
      AB: 'Nghỉ không phép'
    };
    const zones = ['C1', 'D1', 'G1', 'F1', 'I1', 'A2', 'A3', 'B2', 'B3', 'E3', 'I2'];
    const positions = ['C11', 'C12', 'A2', 'A3', 'B2', 'B3', 'E3', 'I2', 'Xe điện', 'Phòng pin'];
    const tasks = ['Báo cáo PDA/6S', 'Kiểm đếm vật tư, vật dụng, thiết bị', '6S'];
    const shifts = ['8:00-17:00', '9:00-18:00', '14:00-23:00', '17:00-02:00'];

    let state = loadState();
    let suppressCloudSave = false;
    let currentUser = getSessionUser();
    let activeTab = 'schedule';
    let selectedDate = isoDate(new Date());

    function defaultEmployees() {
      const names = [
        'Nguyễn Văn A', 'Trần Thị B', 'Lê Văn C', 'Phạm Thị D', 'Hoàng Văn E', 'Vũ Thị F',
        'Đặng Văn G', 'Bùi Thị H', 'Ngô Văn I', 'Dương Thị K', 'Lý Văn L', 'Mai Thị M',
        'Phan Văn N', 'Trương Thị O', 'Hồ Văn P', 'Nguyễn Thị Q', 'Lê Văn R', 'Trần Thị S'
      ];
      return names.map((name, index) => ({
        id: crypto.randomUUID(),
        code: `TU2G3-${String(index + 1).padStart(3, '0')}`,
        name,
        birthDate: '',
        role: index === 0 ? 'Teamlead' : 'Worker',
        zone: zones[index % zones.length],
        position: positions[index % positions.length]
      }));
    }

    function loadState() {
      const saved = localStorage.getItem(STORE_KEY);
      if (saved) return JSON.parse(saved);
      return {
        employees: defaultEmployees(),
        schedule: {},
        activities: [],
        records: [],
        customShifts: [...shifts],
        customTasks: [...tasks],
        customPositions: [...positions],
        accounts: defaultAccounts(),
        updatedAt: new Date().toISOString()
      };
    }

    function saveState() {
      ensureAccounts();
      state.updatedAt = new Date().toISOString();
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      if (!suppressCloudSave && window.saveCloudState) {
        window.saveCloudState(state).catch(err => {
          console.error('Không đồng bộ được Firestore:', err);
          toast('Chưa đồng bộ được dữ liệu online');
        });
      }
      render();
    }

    function applyCloudState(cloudState) {
      if (!cloudState || typeof cloudState !== 'object') return;
      suppressCloudSave = true;
      state = { ...loadState(), ...cloudState };
      ensureAccounts();
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      suppressCloudSave = false;
      render();
    }

    window.getTU2G3State = () => state;
    window.applyTU2G3CloudState = applyCloudState;

    function render() {
      ensureAccounts();
      renderTopActions();
      if (!currentUser) {
        document.getElementById('tabs').innerHTML = '';
        document.getElementById('app').innerHTML = renderLogin();
        return;
      }
      if (!canOpenTab(activeTab)) activeTab = 'schedule';
      renderTabs();
      const app = document.getElementById('app');
      if (activeTab === 'schedule') app.innerHTML = renderSchedule();
      if (activeTab === 'employees') app.innerHTML = renderEmployees();
      if (activeTab === 'activities') app.innerHTML = renderActivities();
      if (activeTab === 'records') app.innerHTML = renderRecords();
      if (activeTab === 'reports') app.innerHTML = renderReports();
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = tabs.filter(([id]) => canOpenTab(id)).map(([id, label]) =>
        `<button class="tab ${activeTab === id ? 'active' : ''}" onclick="activeTab='${id}';render()">${label}</button>`
      ).join('');
    }

    function renderTopActions() {
      const el = document.getElementById('topActions');
      if (!currentUser) {
        el.innerHTML = '';
        return;
      }
      const leadActions = isTeamlead() ? `
        <button class="btn success" onclick="exportExcel()">Xuất Excel</button>
        <button class="btn" onclick="exportBackup()">Sao lưu JSON</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">Nhập JSON</button>
        <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importBackup(event)">
      ` : '';
      el.innerHTML = `
        <span class="user-badge">${escapeHtml(currentUser.label)}</span>
        ${leadActions}
        <button class="btn" onclick="openPasswordForm()">Đổi mật khẩu</button>
        <button class="btn danger" onclick="logout()">Đăng xuất</button>
      `;
    }

    function renderLogin() {
      return `
        <section class="panel auth-card">
          <div class="panel-title"><span>Đăng nhập ứng dụng</span></div>
          <div class="form-grid" style="grid-template-columns:1fr">
            <label>Tài khoản<input id="loginUser" autocomplete="username" placeholder="teamlead hoặc nhanvien"></label>
            <label>Mật khẩu<input id="loginPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"></label>
          </div>
          <div class="toolbar" style="margin-top:14px">
            <button class="btn primary" onclick="login()">Đăng nhập</button>
          </div>
          <div class="muted" style="font-size:13px">Mặc định: teamlead / lead123, nhanvien / nv123. Hãy đổi mật khẩu sau khi đăng nhập.</div>
        </section>
      `;
    }

    function defaultAccounts() {
      return [
        { username: 'teamlead', password: encodePassword('lead123'), role: 'teamlead', label: 'Teamlead' },
        { username: 'nhanvien', password: encodePassword('nv123'), role: 'staff', label: 'Nhân viên' }
      ];
    }

    function ensureAccounts() {
      if (!Array.isArray(state.accounts) || state.accounts.length < 2) state.accounts = defaultAccounts();
    }

    function getSessionUser() {
      const username = sessionStorage.getItem(SESSION_KEY);
      const saved = localStorage.getItem(STORE_KEY);
      if (!username || !saved) return null;
      try {
        const data = JSON.parse(saved);
        const account = (data.accounts || defaultAccounts()).find(acc => acc.username === username);
        return account ? { username: account.username, role: account.role, label: account.label } : null;
      } catch (err) {
        return null;
      }
    }

    function login() {
      ensureAccounts();
      const username = val('loginUser').toLowerCase();
      const password = val('loginPass');
      const account = state.accounts.find(acc => acc.username === username && acc.password === encodePassword(password));
      if (!account) return toast('Sai tài khoản hoặc mật khẩu');
      currentUser = { username: account.username, role: account.role, label: account.label };
      sessionStorage.setItem(SESSION_KEY, account.username);
      activeTab = 'schedule';
      render();
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      currentUser = null;
      activeTab = 'schedule';
      render();
    }

    function openPasswordForm() {
      if (!currentUser) return;
      openModal('Đổi mật khẩu', `
        <div class="form-grid" style="grid-template-columns:1fr">
          <label>Mật khẩu hiện tại<input id="oldPass" type="password" autocomplete="current-password"></label>
          <label>Mật khẩu mới<input id="newPass" type="password" autocomplete="new-password"></label>
          <label>Nhập lại mật khẩu mới<input id="newPass2" type="password" autocomplete="new-password"></label>
        </div>
      `, `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="changePassword()">Lưu mật khẩu</button>`);
    }

    function changePassword() {
      ensureAccounts();
      const account = state.accounts.find(acc => acc.username === currentUser.username);
      if (!account || account.password !== encodePassword(val('oldPass'))) return toast('Mật khẩu hiện tại không đúng');
      if (val('newPass').length < 4) return toast('Mật khẩu mới cần ít nhất 4 ký tự');
      if (val('newPass') !== val('newPass2')) return toast('Mật khẩu mới chưa trùng nhau');
      account.password = encodePassword(val('newPass'));
      closeModal();
      saveState();
      toast('Đã đổi mật khẩu');
    }

    function isTeamlead() {
      return currentUser?.role === 'teamlead';
    }

    function requireTeamlead() {
      if (isTeamlead()) return true;
      toast('Tài khoản nhân viên chỉ được xem lịch');
      return false;
    }

    function canOpenTab(tabId) {
      if (!currentUser) return false;
      if (isTeamlead()) return true;
      return tabId === 'schedule';
    }

    function encodePassword(value) {
      return btoa(unescape(encodeURIComponent(String(value))));
    }

    function renderStats() {
      const today = selectedDate;
      const todayItems = state.employees.map(emp => getEntry(emp.id, today));
      const month = today.slice(0, 7);
      const monthEntries = Object.values(state.schedule).filter(item => item.date.startsWith(month));
      return `
        <section class="grid stats">
          <div class="stat"><div class="label">Tổng nhân sự</div><div class="value">${state.employees.length}</div></div>
          <div class="stat"><div class="label">Đi làm trong ngày</div><div class="value">${todayItems.filter(i => i.status === 'Onl').length}</div></div>
          <div class="stat"><div class="label">Home trong ngày</div><div class="value">${todayItems.filter(i => i.status === 'Home').length}</div></div>
          <div class="stat"><div class="label">Ghi nhận tháng</div><div class="value">${state.records.filter(r => r.date.startsWith(month)).length}</div></div>
        </section>
      `;
    }

    function renderSchedule() {
      const week = weekDates(selectedDate);
      return `
        ${renderStats()}
        <section class="panel">
          <div class="panel-title">
            <span>Lịch tuần ${formatDate(week[0])} - ${formatDate(week[6])}</span>
            <span class="muted">${TEAM}</span>
          </div>
          <div class="toolbar">
            <button class="btn" onclick="moveWeek(-1)">Tuần trước</button>
            <input type="date" value="${selectedDate}" onchange="selectedDate=this.value;render()">
            <button class="btn" onclick="moveWeek(1)">Tuần sau</button>
            ${isTeamlead() ? `
              <button class="btn primary" onclick="autoScheduleWeek()">Sắp lịch tự động</button>
              <button class="btn warn" onclick="validateSchedule()">Kiểm tra logic</button>
              <button class="btn" onclick="openListsForm()">Danh mục ca/vị trí/công tác</button>
            ` : '<span class="user-badge">Chỉ xem lịch công ca</span>'}
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nhân sự</th>
                  ${week.map(d => `<th>${weekday(d)}<br>${formatDate(d)}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${state.employees.map(emp => `
                  <tr>
                    <td>
                      <div class="emp-name">${escapeHtml(emp.name)}</div>
                      <div class="emp-meta">${escapeHtml(emp.code)} | ${escapeHtml(emp.role)} | ${escapeHtml(emp.zone)}</div>
                    </td>
                    ${week.map(d => renderDayCell(emp, isoDate(d))).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderDayCell(emp, date) {
      const entry = getEntry(emp.id, date);
      return `
        <td>
          <button class="day-cell" ${isTeamlead() ? `onclick="openScheduleForm('${emp.id}', '${date}')"` : 'disabled'}>
            <span class="pill s-${entry.status}">${entry.status}</span>
            <span class="cell-line">${escapeHtml(entry.shift || '-')}</span>
            <span class="cell-line">${escapeHtml(entry.position || emp.position || '-')}</span>
            <span class="cell-line muted">${escapeHtml(entry.task || '-')}</span>
          </button>
        </td>
      `;
    }

    function getEntry(employeeId, date) {
      return state.schedule[`${employeeId}_${date}`] || {
        employeeId,
        date,
        status: 'Onl',
        shift: state.customShifts[0],
        zone: '',
        position: '',
        task: ''
      };
    }

    function openScheduleForm(employeeId, date) {
      if (!requireTeamlead()) return;
      const emp = state.employees.find(e => e.id === employeeId);
      const entry = getEntry(employeeId, date);
      openModal(`Phân công: ${emp.name} - ${date}`, `
        <div class="form-grid">
          ${selectField('Trạng thái', 'fStatus', Object.keys(statuses), entry.status, key => `${key} - ${statuses[key]}`)}

    function saveScheduleEntry(employeeId, date) {
      if (!requireTeamlead()) return;
      state.schedule[`${employeeId}_${date}`] = {
        employeeId,
        date,
        status: val('fStatus'),
        shift: val('fShift'),
        zone: val('fZone'),
        position: val('fPosition'),
        task: val('fTask'),
        note: val('fNote')
      };
      closeModal();
      saveState();
      toast('Đã lưu phân công');
    }

    function autoScheduleWeek() {
      if (!requireTeamlead()) return;
      const week = weekDates(selectedDate).map(isoDate);
      const monthCounts = countHomeByEmployee(selectedDate.slice(0, 7));
      const sorted = [...state.employees].sort((a, b) => (monthCounts[a.id] || 0) - (monthCounts[b.id] || 0));
      sorted.forEach((emp, index) => {
        const restIndex = index % 7;
        const homeTarget = index % 3;
        let homes = 0;
        week.forEach((date, dayIndex) => {
          let status = 'Onl';
          if (dayIndex === restIndex) status = 'Rest';
          if (dayIndex > restIndex && homes < homeTarget) {
            status = 'Home';
            homes++;
          }
          state.schedule[`${emp.id}_${date}`] = {
            employeeId: emp.id,
            date,
            status,
            shift: state.customShifts[index % state.customShifts.length],
            zone: emp.zone,
            position: emp.position,
            task: status === 'Onl' ? state.customTasks[(index + dayIndex) % state.customTasks.length] : ''
          };
        });
      });
      saveState();
      toast('Đã sắp lịch tự động cho tuần này');
    }

    function validateSchedule() {
      if (!requireTeamlead()) return;
      const week = weekDates(selectedDate).map(isoDate);
      const errors = [];
      state.employees.forEach(emp => {
        const entries = week.map(date => getEntry(emp.id, date));
        const restIndex = entries.findIndex(e => e.status === 'Rest');
        const homeCount = entries.filter(e => e.status === 'Home').length;
        if (restIndex < 0) errors.push(`${emp.name}: thiếu 1 ngày Rest trong tuần`);
        if (homeCount > 3) errors.push(`${emp.name}: có ${homeCount} ngày Home, vượt quá 3`);
        if (entries.some((e, index) => e.status === 'Home' && (restIndex < 0 || index < restIndex))) {
          errors.push(`${emp.name}: có Home trước Rest`);
        }
      });
      const balance = homeBalance(selectedDate.slice(0, 7));
      if (!balance.ok) errors.push(`Home tháng lệch ${balance.diff} ngày, vượt ngưỡng ${balance.allowed} ngày (${balance.percent}%).`);
      openModal('Kết quả kiểm tra lịch', errors.length
        ? `<div class="list">${errors.map(e => `<div class="card" style="border-color:#fda29b;color:#b42318">${escapeHtml(e)}</div>`).join('')}</div>`
        : `<div class="card" style="border-color:#6ce9a6;color:#027a48">Lịch hợp lệ theo các quy tắc hiện tại.</div>`,
        `<button class="btn primary" onclick="closeModal()">Đã rõ</button>`);
    }

                ${state.employees.map(emp => {

    function countHomeByEmployee(month) {
      const counts = {};
      state.employees.forEach(e => counts[e.id] = 0);
      Object.values(state.schedule).forEach(entry => {
        if (entry.date.startsWith(month) && entry.status === 'Home') counts[entry.employeeId] = (counts[entry.employeeId] || 0) + 1;
      });
      return counts;
    }

    function homeBalance(month) {
      const values = Object.values(countHomeByEmployee(month));
      const avg = values.length ? sum(values) / values.length : 0;
      const min = values.length ? Math.min(...values) : 0;
      const max = values.length ? Math.max(...values) : 0;
      const allowed = Math.max(1, Math.ceil(avg * 0.05));
      return { ok: max - min <= allowed, diff: max - min, allowed, percent: avg ? Math.round((max - min) / avg * 100) : 0 };
    }

    function moveWeek(delta) {
      const d = new Date(selectedDate);
      d.setDate(d.getDate() + delta * 7);
      selectedDate = isoDate(d);
      render();
    }

    function weekDates(dateString) {
      const d = new Date(dateString + 'T00:00:00');
      const day = d.getDay() || 7;
      const monday = new Date(d);
      monday.setDate(d.getDate() - day + 1);
      return Array.from({ length: 7 }, (_, i) => {
        const x = new Date(monday);
        x.setDate(monday.getDate() + i);
        return x;
      });
    }

    function exportExcel() {
      if (!requireTeamlead()) return;
      const month = selectedDate.slice(0, 7);
      const week = weekDates(selectedDate).map(isoDate);
      const rows = [];
      rows.push(['Nhân sự', 'Mã NV', ...week]);
      state.employees.forEach(emp => {
        rows.push([emp.name, emp.code, ...week.map(date => {
          const e = getEntry(emp.id, date);
          return `${e.status} | ${e.shift || ''} | ${e.position || ''} | ${e.task || ''}`;
        })]);
      });
      rows.push([]);
      rows.push(['Báo cáo tháng', month]);
      rows.push(['Nhân sự', 'Home', 'Rest', 'Điểm', 'Hoạt động hoàn thành']);
      state.employees.forEach(emp => {
        const entries = Object.values(state.schedule).filter(e => e.employeeId === emp.id && e.date.startsWith(month));
        const score = state.records.filter(r => r.employeeId === emp.id && r.date.startsWith(month)).reduce((n, r) => n + Number(r.points || 0), 0);
        const acts = state.activities.filter(a => a.employeeId === emp.id && a.date.startsWith(month));
        rows.push([emp.name, entries.filter(e => e.status === 'Home').length, entries.filter(e => e.status === 'Rest').length, score, `${acts.filter(a => a.done).length}/${acts.length}`]);
      });
      const html = `<table>${rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(String(cell ?? ''))}</td>`).join('')}</tr>`).join('')}</table>`;
      download(`TU2G3_bao_cao_${month}.xls`, html, 'application/vnd.ms-excel;charset=utf-8');
    }

    function importBackup(event) {
      if (!requireTeamlead()) return;

      reader.onload = () => {

          toast('Đã nhập dữ liệu');

    function selectField(label, id, options, selected, formatter = v => v) {
      return `<label>${label}<select id="${id}">${options.map(v => `<option value="${escapeAttr(v)}" ${String(v) === String(selected) ? 'selected' : ''}>${escapeHtml(formatter(v))}</option>`).join('')}</select></label>`;
    }

    function openModal(title, body, foot) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modalFoot').innerHTML = foot;
      document.getElementById('modal').showModal();
    }
    function closeModal() { document.getElementById('modal').close(); }
    function val(id) { return document.getElementById(id).value.trim(); }
    function lines(id, fallback) {
      const values = val(id).split(/\n+/).map(x => x.trim()).filter(Boolean);
      return values.length ? values : [...fallback];
    }
    function upsert(list, item) {
      const idx = list.findIndex(x => x.id === item.id);
      if (idx >= 0) list[idx] = item;
      else list.push(item);
    }
    function isoDate(date) { return date.toISOString().slice(0, 10); }
    function formatDate(date) { return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}`; }
    function weekday(date) { return ['CN','T2','T3','T4','T5','T6','T7'][date.getDay()]; }
    function sum(nums) { return nums.reduce((a, b) => a + Number(b || 0), 0); }
    function escapeHtml(text) {
      return String(text ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
    }
    function escapeAttr(text) { return escapeHtml(text); }
    function download(filename, content, type) {
      const blob = new Blob(['\ufeff', content], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
