<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer Unit2 Group 3</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --brand: #155eef;
      --brand-2: #0e9384;
      --danger: #d92d20;
      --warn: #dc6803;
      --ok: #039855;
      --shadow: 0 2px 12px rgba(21,32,51,.07);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,"Helvetica Neue",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }

    /* ── TOPBAR ── */
    .topbar { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:0 2px 8px rgba(21,32,51,.06); }
    .top-inner { max-width:1280px; margin:0 auto; padding:10px 12px 8px; }
    .brand-row { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:nowrap; }
    h1 { margin:0; font-size:16px; line-height:1.2; white-space:nowrap; }
    .subtitle { color:var(--muted); font-size:11px; margin-top:1px; }
    .top-right { display:flex; align-items:center; gap:6px; flex-wrap:nowrap; flex-shrink:0; }
    .user-badge { border:1px solid var(--line); border-radius:20px; padding:5px 10px; color:var(--muted); background:#fff; font-size:12px; white-space:nowrap; }

    /* ── HAMBURGER MENU ── */
    .menu-btn { background:none; border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:18px; line-height:1; color:var(--ink); }
    .action-drawer { display:none; position:fixed; top:0; right:0; bottom:0; width:240px; background:#fff; box-shadow:-4px 0 20px rgba(21,32,51,.18); z-index:100; flex-direction:column; padding:16px 12px; gap:8px; overflow-y:auto; }
    .action-drawer.open { display:flex; }
    .drawer-overlay { display:none; position:fixed; inset:0; background:rgba(21,32,51,.35); z-index:99; }
    .drawer-overlay.open { display:block; }
    .drawer-header { font-weight:800; font-size:15px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; }
    .drawer-close { background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; }

    /* ── TABS ── */
    .tabs { display:flex; gap:4px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { border:1px solid var(--line); background:#fff; color:#344054; border-radius:20px; padding:6px 14px; white-space:nowrap; font-size:13px; font-weight:600; }
    .tab.active { background:var(--brand); border-color:var(--brand); color:#fff; }

    /* ── MAIN ── */
    main { max-width:1280px; margin:0 auto; padding:12px 10px 80px; }

    /* ── BUTTONS ── */
    .btn { border:1px solid var(--line); background:#fff; color:#344054; border-radius:8px; min-height:40px; padding:8px 14px; display:inline-flex; align-items:center; gap:6px; justify-content:center; font-size:13px; font-weight:600; }
    .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
    .btn.success { background:var(--brand-2); border-color:var(--brand-2); color:#fff; }
    .btn.danger  { background:var(--danger); border-color:var(--danger); color:#fff; }
    .btn.warn    { background:var(--warn); border-color:var(--warn); color:#fff; }
    .btn.sm      { min-height:32px; padding:5px 10px; font-size:12px; }
    .btn.block   { width:100%; }

    /* ── STATS ── */
    .grid { display:grid; gap:10px; }
    .stats { grid-template-columns:repeat(2,1fr); margin-bottom:12px; }
    @media(min-width:540px){ .stats { grid-template-columns:repeat(4,1fr); } }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:12px; }
    .stat .label { color:var(--muted); font-size:11px; }
    .stat .value { font-size:24px; font-weight:800; margin-top:2px; }

    /* ── PANELS & CARDS ── */
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:12px; margin-bottom:12px; }
    .panel-title { font-weight:800; margin-bottom:10px; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); padding:12px; display:grid; gap:8px; }
    .card-row { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .list { display:grid; gap:10px; }

    /* ── TOOLBAR ── */
    .toolbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; }

    /* ── TABLE — mobile: card stack ── */
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
    table { border-collapse:collapse; width:100%; min-width:860px; }
    th,td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px; vertical-align:top; text-align:left; font-size:12px; }
    th { position:sticky; top:0; z-index:2; background:#f2f4f7; font-weight:800; }
    td:first-child,th:first-child { position:sticky; left:0; z-index:3; background:#fff; min-width:150px; }
    th:first-child { background:#f2f4f7; z-index:4; }

    /* Mobile schedule: card per employee */
    .sched-cards { display:none; }
    @media(max-width:680px){
      .table-wrap .sched-table { display:none; }
      .sched-cards { display:grid; gap:10px; }
    }
    .sched-card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .sched-card-head { background:#f2f4f7; padding:10px 12px; font-weight:800; font-size:13px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    .sched-card-meta { font-size:11px; color:var(--muted); font-weight:400; }
    .sched-days { display:grid; grid-template-columns:repeat(7,1fr); }
    .sched-day { border-right:1px solid var(--line); border-top:1px solid var(--line); padding:6px 4px; text-align:center; }
    .sched-day:last-child { border-right:none; }
    .sched-day-label { font-size:10px; color:var(--muted); font-weight:700; margin-bottom:4px; }

    /* ── PILLS ── */
    .pill { display:inline-flex; align-items:center; border-radius:999px; padding:3px 8px; font-weight:800; font-size:12px; color:#fff; letter-spacing:.3px; }
    .s-Onl  { background:#039855; }
    .s-Home { background:#dc6803; }
    .s-Rest { background:#475467; }
    .s-PL,.s-AL,.s-VA { background:#155eef; }
    .s-BL,.s-PTL,.s-MTL,.s-ML { background:#7a5af8; }
    .s-AB   { background:#d92d20; }

    .cell-line { color:#344054; font-size:11px; display:block; line-height:1.4; }
    .cell-line.muted { color:var(--muted); }
    .cell-shift { display:block; font-size:13px; font-weight:800; color:#155eef; line-height:1.3; margin-top:2px; }
    .cell-pos   { display:block; font-size:13px; font-weight:800; color:#0e9384; line-height:1.3; }

    /* ── FORM ── */
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    @media(max-width:480px){ .form-grid { grid-template-columns:1fr; } }
    label { display:grid; gap:4px; color:#344054; font-size:13px; font-weight:700; }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; background:#fff; color:var(--ink); font-size:14px; }
    textarea { min-height:80px; resize:vertical; }

    /* ── DIALOG ── */
    dialog { width:min(680px,calc(100vw - 16px)); border:0; border-radius:12px; padding:0; box-shadow:0 20px 60px rgba(21,32,51,.28); max-height:90vh; overflow:auto; }
    dialog::backdrop { background:rgba(21,32,51,.45); }
    .modal-head,.modal-foot { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .modal-foot { border-bottom:0; border-top:1px solid var(--line); justify-content:flex-end; }
    .modal-body { padding:14px; }

    /* ── LOGIN ── */
    .login-wrap { display:flex; align-items:flex-start; justify-content:center; min-height:70vh; padding:24px 12px; }
    .login-card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); width:100%; max-width:420px; padding:24px 20px; }
    .login-title { font-size:18px; font-weight:800; margin-bottom:4px; }
    .login-sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
    .login-type-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
    .type-btn { border:2px solid var(--line); background:#f9fafb; border-radius:10px; padding:14px 8px; text-align:center; cursor:pointer; transition:.15s; }
    .type-btn.chosen { border-color:var(--brand); background:#eff6ff; color:var(--brand); }
    .type-btn .type-icon { font-size:28px; margin-bottom:6px; }
    .type-btn .type-label { font-size:13px; font-weight:800; }
    .type-btn .type-desc { font-size:11px; color:var(--muted); margin-top:2px; }
    .type-btn.chosen .type-desc { color:#93c5fd; }
    .login-fields { display:grid; gap:12px; }
    .login-hint { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5; }

    /* ── MISC ── */
    .muted { color:var(--muted); }
    .score-pos { color:var(--ok); font-weight:800; }
    .score-neg { color:var(--danger); font-weight:800; }
    .summary-table { min-width:600px; }
    .bar { height:8px; background:#e4e7ec; border-radius:999px; overflow:hidden; min-width:80px; }
    .bar span { display:block; height:100%; background:var(--brand-2); }
    .day-summary { background:#fff; border:2px solid #d9dee8; border-radius:10px; padding:12px; margin-bottom:12px; }
    .day-summary-title { font-weight:800; font-size:14px; margin-bottom:10px; color:#172033; }
    .summary-note { color:#667085; font-size:13px; padding:8px 0; }
    .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px); background:#172033; color:#fff; padding:10px 18px; border-radius:999px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.2s ease; z-index:200; font-size:13px; font-weight:600; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .hidden { display:none !important; }
    .emp-name { font-weight:800; }
    .emp-meta { color:var(--muted); font-size:11px; margin-top:1px; }
    .day-cell { display:grid; gap:3px; min-width:110px; min-height:80px; border:0; background:transparent; text-align:left; padding:4px 2px; width:100%; cursor:pointer; }
    .day-cell[disabled] { cursor:default; }
  </style>
</head>
<body>
  <!-- Drawer overlay -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <!-- Action drawer (hamburger menu) -->
  <div class="action-drawer" id="actionDrawer">
    <div class="drawer-header">Menu <button class="drawer-close" onclick="closeDrawer()">✕</button></div>
    <div id="drawerActions"></div>
  </div>

  <header class="topbar">
    <div class="top-inner">
      <div class="brand-row">
        <div>
          <h1>Transfer Unit2 Group 3</h1>
          <div class="subtitle">Shein · BW Long An</div>
        </div>
        <div class="top-right">
          <div id="topUserBadge"></div>
          <button class="menu-btn" id="menuBtn" onclick="toggleDrawer()" aria-label="Menu">☰</button>
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>

  <main id="app"></main>

  <dialog id="modal">
    <div class="modal-head">
      <strong id="modalTitle"></strong>
      <button class="btn sm" onclick="closeModal()">Đóng</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </dialog>
  <div class="toast" id="toast"></div>

  <script>
    const TEAM = 'Transfer Unit2 Group 3';
    const STORE_KEY = 'tu2g3_management_v2';
    const SESSION_KEY = 'tu2g3_current_user';
    const tabs = [
      ['schedule', 'Lịch làm việc'],
      ['employees', 'Nhân sự'],
      ['activities', 'Hoạt động'],
      ['records', 'Ghi nhận'],
      ['reports', 'Báo cáo']
    ];
    const statuses = {
      Onl: 'Đi làm',
      Home: 'Nghỉ vượt',
      Rest: 'Nghỉ tuần',
      PL: 'Phép cá nhân',
      AL: 'Phép năm',
      BL: 'Phép tang',
      PTL: 'Nghỉ thai sản nam',
      MTL: 'Nghỉ thai sản nữ',
      ML: 'Nghỉ kết hôn',
      VA: 'Nghỉ lễ',
      AB: 'Nghỉ không phép'
    };
    const zones = ['C1', 'D1', 'G1', 'F1', 'I1', 'A2', 'A3', 'B2', 'B3', 'E3', 'I2'];
    const positions = ['C11', 'C12', 'A2', 'A3', 'B2', 'B3', 'E3', 'I2', 'Xe điện', 'Phòng pin'];
    const tasks = ['Báo cáo PDA/6S', 'Kiểm đếm vật tư, vật dụng, thiết bị', '6S'];
    const shifts = ['8:00-17:00', '9:00-18:00', '14:00-23:00', '17:00-02:00'];

    let state = loadState();
    let suppressCloudSave = false;
    let currentUser = getSessionUser();
    let activeTab = 'schedule';
    let selectedDate = isoDate(new Date());

    function defaultEmployees() {
      const names = [
        'Nguyễn Văn A', 'Trần Thị B', 'Lê Văn C', 'Phạm Thị D', 'Hoàng Văn E', 'Vũ Thị F',
        'Đặng Văn G', 'Bùi Thị H', 'Ngô Văn I', 'Dương Thị K', 'Lý Văn L', 'Mai Thị M',
        'Phan Văn N', 'Trương Thị O', 'Hồ Văn P', 'Nguyễn Thị Q', 'Lê Văn R', 'Trần Thị S'
      ];
      return names.map((name, index) => ({
        id: crypto.randomUUID(),
        code: `TU2G3-${String(index + 1).padStart(3, '0')}`,
        name,
        birthDate: '',
        role: index === 0 ? 'Teamlead' : 'Worker',
        zone: zones[index % zones.length],
        position: positions[index % positions.length]
      }));
    }

    function loadState() {
      const saved = localStorage.getItem(STORE_KEY);
      if (saved) return JSON.parse(saved);
      return {
        employees: defaultEmployees(),
        schedule: {},
        activities: [],
        records: [],
        customShifts: [...shifts],
        customTasks: [...tasks],
        customPositions: [...positions],
        accounts: defaultAccounts(),
        updatedAt: new Date().toISOString()
      };
    }

    function saveState() {
      ensureAccounts();
      state.updatedAt = new Date().toISOString();
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      if (!suppressCloudSave && window.saveCloudState) {
        window.saveCloudState(state).catch(err => {
          console.error('Không đồng bộ được Firestore:', err);
          toast('Chưa đồng bộ được dữ liệu online');
        });
      }
      render();
    }

    function applyCloudState(cloudState) {
      if (!cloudState || typeof cloudState !== 'object') return;
      // So sánh updatedAt: chỉ apply nếu cloud mới hơn local
      const localTs  = state.updatedAt || '';
      const cloudTs  = cloudState.updatedAt || cloudState.cloudUpdatedAt || '';
      // Nếu local không có gì (lần đầu mở trên điện thoại) → apply luôn
      const localEmpty = !state.employees || state.employees.length === 0;
      if (!localEmpty && cloudTs && localTs && cloudTs <= localTs) return; // local đã mới hơn
      suppressCloudSave = true;
      state = { ...loadState(), ...cloudState };
      ensureAccounts();
      state.updatedAt = cloudTs || new Date().toISOString();
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      suppressCloudSave = false;
      render();
      toast('✅ Đã đồng bộ dữ liệu mới nhất');
    }

    window.getTU2G3State = () => state;
    window.applyTU2G3CloudState = applyCloudState;

    function render() {
      ensureAccounts();
      renderTopActions();
      if (!currentUser) {
        document.getElementById('tabs').innerHTML = '';
        document.getElementById('app').innerHTML = renderLogin();
        // After rendering, init the login type UI
        setTimeout(() => { if (typeof setLoginType === 'function') setLoginType(_loginType || 'teamlead'); }, 0);
        return;
      }
      if (!canOpenTab(activeTab)) activeTab = 'schedule';
      renderTabs();
      const app = document.getElementById('app');
      if (activeTab === 'schedule')  app.innerHTML = renderSchedule();
      if (activeTab === 'employees') app.innerHTML = renderEmployees();
      if (activeTab === 'activities')app.innerHTML = renderActivities();
      if (activeTab === 'records')   app.innerHTML = renderRecords();
      if (activeTab === 'reports')   app.innerHTML = renderReports();
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = tabs.filter(([id]) => canOpenTab(id)).map(([id, label]) =>
        `<button class="tab ${activeTab === id ? 'active' : ''}" onclick="activeTab='${id}';render()">${label}</button>`
      ).join('');
    }

    function renderTopActions() {
      const badge = document.getElementById('topUserBadge');
      const drawer = document.getElementById('drawerActions');
      const menuBtn = document.getElementById('menuBtn');
      if (!currentUser) {
        if (badge) badge.innerHTML = '';
        if (drawer) drawer.innerHTML = '';
        if (menuBtn) menuBtn.style.display = 'none';
        return;
      }
      if (badge) badge.innerHTML = `<span class="user-badge">${escapeHtml(currentUser.label)}</span>`;
      if (menuBtn) menuBtn.style.display = '';
      const leadItems = isTeamlead() ? `
        <button class="btn block success" onclick="closeDrawer();exportExcel()">📊 Xuất Excel</button>
        <button class="btn block" onclick="closeDrawer();exportBackup()">💾 Sao lưu JSON</button>
        <button class="btn block" onclick="closeDrawer();document.getElementById('importFile').click()">📥 Nhập JSON</button>
        <button class="btn block primary" onclick="closeDrawer();pushCloudNow()">☁️ Đẩy lên Cloud</button>
        <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importBackup(event)">
        <hr style="border:none;border-top:1px solid var(--line);margin:4px 0">
        <button class="btn block" onclick="closeDrawer();openPasswordForm()">🔑 Đổi mật khẩu</button>
      ` : `<button class="btn block" onclick="closeDrawer();openPasswordForm()">🔑 Đổi mật khẩu</button>`;
      if (drawer) drawer.innerHTML = leadItems + `<button class="btn block danger" onclick="closeDrawer();logout()">🚪 Đăng xuất</button>`;
    }
    function toggleDrawer() {
      document.getElementById('actionDrawer').classList.toggle('open');
      document.getElementById('drawerOverlay').classList.toggle('open');
    }
    function closeDrawer() {
      document.getElementById('actionDrawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('open');
    }

    function renderLogin() {
      return `
        <div class="login-wrap">
          <div class="login-card">
            <div class="login-title">Đăng nhập</div>
            <div class="login-sub">Transfer Unit2 Group 3 · Shein</div>
            <div class="login-type-row">
              <div class="type-btn chosen" id="typeTL" onclick="setLoginType('teamlead')">
                <div class="type-icon">👤</div>
                <div class="type-label">Teamlead</div>
                <div class="type-desc">Mật khẩu riêng</div>
              </div>
              <div class="type-btn" id="typeNV" onclick="setLoginType('staff')">
                <div class="type-icon">🪪</div>
                <div class="type-label">Nhân viên</div>
                <div class="type-desc">Mã nhân viên</div>
              </div>
            </div>
            <div class="login-fields" id="loginFields">
              <!-- filled by setLoginType() -->
            </div>
            <button class="btn primary block" style="margin-top:14px" onclick="login()">Đăng nhập</button>
            <div class="login-hint" id="loginHint"></div>
          </div>
        </div>
      `;
    }
    let _loginType = 'teamlead';
    function setLoginType(type) {
      _loginType = type;
      document.getElementById('typeTL').classList.toggle('chosen', type === 'teamlead');
      document.getElementById('typeNV').classList.toggle('chosen', type === 'staff');
      const fields = document.getElementById('loginFields');
      const hint   = document.getElementById('loginHint');
      if (type === 'teamlead') {
        fields.innerHTML = `
          <label>Tên đăng nhập<input id="loginUser" autocomplete="username" placeholder="teamlead" value="teamlead"></label>
          <label>Mật khẩu<input id="loginPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" onkeydown="if(event.key==='Enter')login()"></label>`;
        hint.textContent = 'Mặc định: teamlead / lead123. Đổi mật khẩu sau khi đăng nhập.';
      } else {
        const empList = state.employees.filter(e => e.code).map(e => `${e.code} — ${e.name}`).join(', ');
        fields.innerHTML = `
          <label>Mã nhân viên<input id="loginCode" autocomplete="off" placeholder="VD: TU2G3-001" style="font-size:16px;letter-spacing:1px" onkeydown="if(event.key==='Enter')login()"></label>`;
        hint.textContent = empList ? ('Mã hợp lệ: ' + empList) : 'Chưa có nhân viên nào được khai báo.';
      }
    }

    function defaultAccounts() {
      return [
        { username: 'teamlead', password: encodePassword('lead123'), role: 'teamlead', label: 'Teamlead' },
        { username: 'nhanvien', password: encodePassword('nv123'), role: 'staff', label: 'Nhân viên' }
      ];
    }

    function ensureAccounts() {
      if (!Array.isArray(state.accounts) || state.accounts.length < 2) state.accounts = defaultAccounts();
    }

    function getSessionUser() {
      const sess = sessionStorage.getItem(SESSION_KEY);
      const saved = localStorage.getItem(STORE_KEY);
      if (!sess || !saved) return null;
      try {
        const data = JSON.parse(saved);
        if (sess.startsWith('tl:')) {
          const uname = sess.slice(3);
          const account = (data.accounts || defaultAccounts()).find(acc => acc.username === uname && acc.role === 'teamlead');
          return account ? { username: account.username, role: account.role, label: account.label } : null;
        } else if (sess.startsWith('nv:')) {
          const empId = sess.slice(3);
          const emp = (data.employees || []).find(e => e.id === empId);
          return emp ? { username: 'emp_' + emp.id, role: 'staff', label: emp.name, empId: emp.id } : null;
        }
        return null;
      } catch (err) { return null; }
    }

    function login() {
      ensureAccounts();
      if (_loginType === 'teamlead') {
        const username = (document.getElementById('loginUser')?.value || '').trim().toLowerCase();
        const password = (document.getElementById('loginPass')?.value || '').trim();
        const account = state.accounts.find(acc => acc.username === username && acc.password === encodePassword(password) && acc.role === 'teamlead');
        if (!account) return toast('Sai tài khoản hoặc mật khẩu');
        currentUser = { username: account.username, role: account.role, label: account.label };
        sessionStorage.setItem(SESSION_KEY, 'tl:' + account.username);
      } else {
        const code = (document.getElementById('loginCode')?.value || '').trim().toUpperCase();
        const emp = state.employees.find(e => (e.code || '').toUpperCase() === code);
        if (!emp) return toast('Mã nhân viên không đúng hoặc chưa được khai báo');
        currentUser = { username: 'emp_' + emp.id, role: 'staff', label: emp.name, empId: emp.id };
        sessionStorage.setItem(SESSION_KEY, 'nv:' + emp.id);
      }
      activeTab = 'schedule';
      render();
    }

    function renderDaySummary(date) {
      // Chỉ tính nhân viên đi làm (Onl)
      const working = state.employees.map(emp => getEntry(emp.id, date)).filter(e => e.status === 'Onl');
      if (!working.length) return '<div class="summary-note">Không có nhân sự đi làm ngày này.</div>';
      // Group by position + shift
      const groups = {};
      working.forEach(e => {
        const emp = state.employees.find(ev => ev.id === e.employeeId) || {};
        const pos = e.position || emp.position || '(Chưa phân vị trí)';
        const sh  = e.shift || '(Chưa phân ca)';
        const key = pos + '|||' + sh;
        if (!groups[key]) groups[key] = { pos, sh, count: 0, names: [] };
        groups[key].count++;
        groups[key].names.push(emp.name || '');
      });
      const rows = Object.values(groups).sort((a,b) => a.pos.localeCompare(b.pos) || a.sh.localeCompare(b.sh));
      return `
        <div class="day-summary">
          <div class="day-summary-title">📊 Tổng hợp ngày ${date} — ${working.length} người đi làm</div>
          <div class="table-wrap" style="margin-bottom:0">
            <table>
              <thead><tr>
                <th>Vị trí</th>
                <th>Ca làm</th>
                <th style="text-align:center">Số lượng</th>
                <th>Nhân viên</th>
              </tr></thead>
              <tbody>
                ${rows.map(r => `<tr>
                  <td><strong style="color:#0e9384;font-size:14px">${escapeHtml(r.pos)}</strong></td>
                  <td><strong style="color:#155eef;font-size:14px">${escapeHtml(r.sh)}</strong></td>
                  <td style="text-align:center;font-size:18px;font-weight:900;color:#172033">${r.count}</td>
                  <td style="font-size:11px;color:#667085">${r.names.map(escapeHtml).join(', ')}</td>
                </tr>`).join('')}
                <tr style="background:#f2f4f7">
                  <td colspan="2"><strong>Tổng cộng</strong></td>
                  <td style="text-align:center;font-size:18px;font-weight:900;color:#155eef">${working.length}</td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>`;
    }

      state.schedule[`${employeeId}_${date}`] = {
        employeeId,

      };

    function autoScheduleWeek() {
      if (!requireTeamlead()) return;
      const week = weekDates(selectedDate).map(isoDate);
      const monthCounts = countHomeByEmployee(selectedDate.slice(0, 7));
      const sorted = [...state.employees].sort((a, b) => (monthCounts[a.id] || 0) - (monthCounts[b.id] || 0));
      sorted.forEach((emp, index) => {
        const restIndex = index % 7;
        const homeTarget = index % 3;
        let homes = 0;
        week.forEach((date, dayIndex) => {
          let status = 'Onl';
          if (dayIndex === restIndex) status = 'Rest';
          if (dayIndex > restIndex && homes < homeTarget) {
            status = 'Home';
            homes++;
          }
          state.schedule[`${emp.id}_${date}`] = {
            employeeId: emp.id,
            date,
            status,
            shift: state.customShifts[index % state.customShifts.length],
            zone: emp.zone,
            position: emp.position,
            task: status === 'Onl' ? state.customTasks[(index + dayIndex) % state.customTasks.length] : ''
          };
        });
      });
      saveState();
      toast('Đã sắp lịch tự động cho tuần này');
    }

    function validateSchedule() {
      if (!requireTeamlead()) return;
      const week = weekDates(selectedDate).map(isoDate);
      const errors = [];
      state.employees.forEach(emp => {
        const entries = week.map(date => getEntry(emp.id, date));
        const restIndex = entries.findIndex(e => e.status === 'Rest');
        const homeCount = entries.filter(e => e.status === 'Home').length;
        if (restIndex < 0) errors.push(`${emp.name}: thiếu 1 ngày Rest trong tuần`);
        if (homeCount > 3) errors.push(`${emp.name}: có ${homeCount} ngày Home, vượt quá 3`);
        if (entries.some((e, index) => e.status === 'Home' && (restIndex < 0 || index < restIndex))) {
          errors.push(`${emp.name}: có Home trước Rest`);
        }
      });
      const balance = homeBalance(selectedDate.slice(0, 7));
      if (!balance.ok) errors.push(`Home tháng lệch ${balance.diff} ngày, vượt ngưỡng ${balance.allowed} ngày (${balance.percent}%).`);
      openModal('Kết quả kiểm tra lịch', errors.length
        ? `<div class="list">${errors.map(e => `<div class="card" style="border-color:#fda29b;color:#b42318">${escapeHtml(e)}</div>`).join('')}</div>`
        : `<div class="card" style="border-color:#6ce9a6;color:#027a48">Lịch hợp lệ theo các quy tắc hiện tại.</div>`,
        `<button class="btn primary" onclick="closeModal()">Đã rõ</button>`);
    }

    function saveEmployee(id) {
      if (!requireTeamlead()) return;
      const payload = {
        id: id || crypto.randomUUID(),
        code: val('eCode'),
        name: val('eName'),
        birthDate: val('eBirth'),
        role: val('eRole'),
        zone: val('eZone'),
        position: val('ePosition')
      };
      if (!payload.code || !payload.name) return toast('Cần nhập mã và họ tên');
      const idx = state.employees.findIndex(e => e.id === id);
      if (idx >= 0) state.employees[idx] = payload;
      else state.employees.push(payload);
      closeModal();
      saveState();
    }

    function deleteEmployee(id) {
      if (!requireTeamlead()) return;
      const emp = state.employees.find(e => e.id === id);
      if (!confirm(`Xóa nhân sự ${emp.name}?`)) return;
      removeEmployees([id]);
      saveState();
    }

    function deleteSelectedEmployees() {
      if (!requireTeamlead()) return;
      const ids = Array.from(document.querySelectorAll('.emp-check:checked')).map(input => input.value);
      if (!ids.length) return toast('Chưa chọn nhân sự nào');
      if (!confirm(`Xóa ${ids.length} nhân sự đã chọn?`)) return;
      removeEmployees(ids);
      saveState();
    }

    function removeEmployees(ids) {
      const removeSet = new Set(ids);
      state.employees = state.employees.filter(e => !removeSet.has(e.id));
      Object.keys(state.schedule).forEach(key => {
        if (ids.some(id => key.startsWith(`${id}_`))) delete state.schedule[key];
      });
      state.activities = state.activities.filter(a => !removeSet.has(a.employeeId));
      state.records = state.records.filter(r => !removeSet.has(r.employeeId));
    }

    function saveActivity(id) {
      if (!requireTeamlead()) return;
      const payload = { id: id || crypto.randomUUID(), employeeId: val('aEmployee'), date: val('aDate'), type: val('aType'), title: val('aTitle'), done: val('aDone') === 'true', note: val('aNote') };
      if (!payload.employeeId || !payload.title) return toast('Cần chọn nhân sự và nhập tiêu đề');
      upsert(state.activities, payload);
      closeModal();
      saveState();
    }

    function deleteActivity(id) {
      if (!requireTeamlead()) return;
      if (!confirm('Xóa hoạt động này?')) return;
      state.activities = state.activities.filter(a => a.id !== id);
      saveState();
    }

    function renderRecords() {
      const month = selectedDate.slice(0, 7);
      return `
        <section class="panel">
          <div class="panel-title"><span>Ghi nhận bất thường / vi phạm / thành tích</span><button class="btn primary" onclick="openRecordForm()">Thêm ghi nhận</button></div>
          <div class="toolbar"><input type="month" value="${month}" onchange="selectedDate=this.value+'-01';render()"></div>
          <div class="list">
            ${state.records.filter(r => r.date.startsWith(month)).sort((a,b) => b.date.localeCompare(a.date)).map(r => {
              const emp = state.employees.find(e => e.id === r.employeeId);
              return `<div class="card">
                <div class="card-row"><strong>${escapeHtml(r.type)}</strong><span class="${r.points >= 0 ? 'score-pos' : 'score-neg'}">${r.points} điểm</span></div>
                <div class="muted">${r.date} | ${escapeHtml(emp?.name || 'Không rõ')}</div>
                <div>${escapeHtml(r.note)}</div>
                <div><button class="btn sm" onclick="openRecordForm('${r.id}')">Sửa</button> <button class="btn sm danger" onclick="deleteRecord('${r.id}')">Xóa</button></div>
              </div>`;
            }).join('') || '<div class="card muted">Chưa có ghi nhận trong tháng này.</div>'}
          </div>
        </section>
      `;
    }

    function openRecordForm(id = '') {
      if (!requireTeamlead()) return;
      const item = state.records.find(r => r.id === id) || { employeeId: state.employees[0]?.id || '', date: selectedDate, type: 'Bất thường', points: 0, note: '' };
      openModal(id ? 'Cập nhật ghi nhận' : 'Thêm ghi nhận', `
        <div class="form-grid">
          ${selectField('Nhân sự', 'rEmployee', state.employees.map(e => e.id), item.employeeId, id => state.employees.find(e => e.id === id)?.name || id)}
          <label>Ngày<input id="rDate" type="date" value="${item.date}"></label>
          ${selectField('Loại ghi nhận', 'rType', ['Bất thường', 'Vi phạm', 'Thành tích'], item.type)}
          <label>Điểm cộng/trừ<input id="rPoints" type="number" value="${item.points}"></label>
          <label style="grid-column:1/-1">Nội dung<textarea id="rNote">${escapeHtml(item.note)}</textarea></label>
        </div>
      `, `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveRecord('${id}')">Lưu</button>`);
    }

    function saveRecord(id) {
      if (!requireTeamlead()) return;
      const payload = { id: id || crypto.randomUUID(), employeeId: val('rEmployee'), date: val('rDate'), type: val('rType'), points: Number(val('rPoints') || 0), note: val('rNote') };
      if (!payload.employeeId || !payload.note) return toast('Cần chọn nhân sự và nhập nội dung');
      upsert(state.records, payload);
      closeModal();
      saveState();
    }

    function deleteRecord(id) {
      if (!requireTeamlead()) return;
      if (!confirm('Xóa ghi nhận này?')) return;
      state.records = state.records.filter(r => r.id !== id);
      saveState();
    }

    function renderReports() {
      const month = selectedDate.slice(0, 7);
      const homeCounts = countHomeByEmployee(month);
      const balance = homeBalance(month);
      return `
        <section class="panel">
          <div class="panel-title"><span>Báo cáo tháng ${month}</span><input type="month" value="${month}" onchange="selectedDate=this.value+'-01';render()"></div>
          <div class="grid stats">
            <div class="stat"><div class="label">Tổng Home</div><div class="value">${sum(Object.values(homeCounts))}</div></div>
            <div class="stat"><div class="label">Lệch Home</div><div class="value">${balance.diff}</div></div>
            <div class="stat"><div class="label">Ngưỡng cho phép</div><div class="value">${balance.allowed}</div></div>
            <div class="stat"><div class="label">Trạng thái cân bằng</div><div class="value" style="color:${balance.ok ? 'var(--ok)' : 'var(--danger)'}">${balance.ok ? 'OK' : 'Lệch'}</div></div>
          </div>
          <div class="table-wrap">
            <table class="summary-table">
              <thead><tr><th>Nhân sự</th><th>Home</th><th>Rest</th><th>Vắng khác</th><th>Điểm</th><th>Hoạt động hoàn thành</th></tr></thead>
              <tbody>
                ${state.employees.map(emp => {
                  const monthEntries = Object.values(state.schedule).filter(e => e.employeeId === emp.id && e.date.startsWith(month));
                  const score = state.records.filter(r => r.employeeId === emp.id && r.date.startsWith(month)).reduce((n, r) => n + Number(r.points || 0), 0);
                  const acts = state.activities.filter(a => a.employeeId === emp.id && a.date.startsWith(month));
                  const done = acts.filter(a => a.done).length;
                  const pct = acts.length ? Math.round(done / acts.length * 100) : 0;
                  return `<tr>
                    <td>${escapeHtml(emp.name)}<div class="emp-meta">${escapeHtml(emp.code)}</div></td>
                    <td>${monthEntries.filter(e => e.status === 'Home').length}</td>
                    <td>${monthEntries.filter(e => e.status === 'Rest').length}</td>
                    <td>${monthEntries.filter(e => !['Onl','Home','Rest'].includes(e.status)).length}</td>
                    <td class="${score >= 0 ? 'score-pos' : 'score-neg'}">${score}</td>
                    <td><div>${done}/${acts.length}</div><div class="bar"><span style="width:${pct}%"></span></div></td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function countHomeByEmployee(month) {
      const counts = {};
      state.employees.forEach(e => counts[e.id] = 0);
      Object.values(state.schedule).forEach(entry => {
        if (entry.date.startsWith(month) && entry.status === 'Home') counts[entry.employeeId] = (counts[entry.employeeId] || 0) + 1;
      });
      return counts;
    }

    function homeBalance(month) {
      const values = Object.values(countHomeByEmployee(month));
      const avg = values.length ? sum(values) / values.length : 0;
      const min = values.length ? Math.min(...values) : 0;
      const max = values.length ? Math.max(...values) : 0;
      const allowed = Math.max(1, Math.ceil(avg * 0.05));
      return { ok: max - min <= allowed, diff: max - min, allowed, percent: avg ? Math.round((max - min) / avg * 100) : 0 };
    }

    function moveWeek(delta) {
      const d = new Date(selectedDate);
      d.setDate(d.getDate() + delta * 7);
      selectedDate = isoDate(d);
      render();
    }

    function weekDates(dateString) {
      const d = new Date(dateString + 'T00:00:00');
      const day = d.getDay() || 7;
      const monday = new Date(d);
      monday.setDate(d.getDate() - day + 1);
      return Array.from({ length: 7 }, (_, i) => {
        const x = new Date(monday);
        x.setDate(monday.getDate() + i);
        return x;
      });
    }

    function exportExcel() {
      if (!requireTeamlead()) return;
      const month = selectedDate.slice(0, 7);
      const week = weekDates(selectedDate).map(isoDate);
      const rows = [];
      rows.push(['Nhân sự', 'Mã NV', ...week]);
      state.employees.forEach(emp => {
        rows.push([emp.name, emp.code, ...week.map(date => {
          const e = getEntry(emp.id, date);
          return `${e.status} | ${e.shift || ''} | ${e.position || ''} | ${e.task || ''}`;
        })]);
      });
      rows.push([]);
      rows.push(['Báo cáo tháng', month]);
      rows.push(['Nhân sự', 'Home', 'Rest', 'Điểm', 'Hoạt động hoàn thành']);
      state.employees.forEach(emp => {
        const entries = Object.values(state.schedule).filter(e => e.employeeId === emp.id && e.date.startsWith(month));
        const score = state.records.filter(r => r.employeeId === emp.id && r.date.startsWith(month)).reduce((n, r) => n + Number(r.points || 0), 0);
        const acts = state.activities.filter(a => a.employeeId === emp.id && a.date.startsWith(month));
        rows.push([emp.name, entries.filter(e => e.status === 'Home').length, entries.filter(e => e.status === 'Rest').length, score, `${acts.filter(a => a.done).length}/${acts.length}`]);
      });
      const html = `<table>${rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(String(cell ?? ''))}</td>`).join('')}</tr>`).join('')}</table>`;
      download(`TU2G3_bao_cao_${month}.xls`, html, 'application/vnd.ms-excel;charset=utf-8');
    }

    function exportBackup() {
      if (!requireTeamlead()) return;
      download(`TU2G3_backup_${selectedDate}.json`, JSON.stringify(state, null, 2), 'application/json;charset=utf-8');
    }

    async function pushCloudNow() {
      if (!requireTeamlead()) return;
      if (!window.saveCloudState) return toast('Chưa kết nối được Firestore');
      try {
        await window.saveCloudState(state, true);
        toast('Đã đẩy dữ liệu máy này lên Cloud');
      } catch (err) {
        console.error('Không đẩy được dữ liệu lên Cloud:', err);
        toast('Không đẩy được dữ liệu lên Cloud');
      }
    }

    function importBackup(event) {
      if (!requireTeamlead()) return;
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          state = JSON.parse(reader.result);
          saveState();
          toast('Đã nhập dữ liệu');
        } catch (err) {
          toast('File JSON không hợp lệ');
        }
      };
      reader.readAsText(file, 'utf-8');
      event.target.value = '';
    }

    function selectField(label, id, options, selected, formatter = v => v) {
      return `<label>${label}<select id="${id}">${options.map(v => `<option value="${escapeAttr(v)}" ${String(v) === String(selected) ? 'selected' : ''}>${escapeHtml(formatter(v))}</option>`).join('')}</select></label>`;
    }

    function openModal(title, body, foot) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('modalFoot').innerHTML = foot;
      document.getElementById('modal').showModal();
    }
    function closeModal() { document.getElementById('modal').close(); }
    function val(id) { return document.getElementById(id).value.trim(); }
    function lines(id, fallback) {
      const values = val(id).split(/\n+/).map(x => x.trim()).filter(Boolean);
      return values.length ? values : [...fallback];
    }
    function upsert(list, item) {
      const idx = list.findIndex(x => x.id === item.id);
      if (idx >= 0) list[idx] = item;
      else list.push(item);
    }
    function isoDate(date) { return date.toISOString().slice(0, 10); }
    function formatDate(date) { return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}`; }
    function weekday(date) { return ['CN','T2','T3','T4','T5','T6','T7'][date.getDay()]; }
    function sum(nums) { return nums.reduce((a, b) => a + Number(b || 0), 0); }
    function escapeHtml(text) {
      return String(text ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
    }
    function escapeAttr(text) { return escapeHtml(text); }
    function download(filename, content, type) {
      const blob = new Blob(['\ufeff', content], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    render();
  </script>

<!-- Đồng bộ dữ liệu online bằng Firebase Firestore (realtime) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBS5tTn66Jd9MHhzZjBjLYmg-gffT2s5C8",
    authDomain: "quan-ly-nhan-42d7c.firebaseapp.com",
    databaseURL: "https://quan-ly-nhan-42d7c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quan-ly-nhan-42d7c",
    storageBucket: "quan-ly-nhan-42d7c.firebasestorage.app",
    messagingSenderId: "869638537390",
    appId: "1:869638537390:web:81f8bed3df31e17e01ed3f",
    measurementId: "G-VG9GLD0B7L"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const dataRef = doc(db, "management", "tu2g3_state");

  // Flag: chúng ta đang áp dụng snapshot từ cloud → không ghi ngược lại
  let writingFromSnapshot = false;
  // Debounce local saves to avoid write storms
  let saveTimer = null;

  // Lưu lên Cloud (debounce 800ms, trừ khi force=true)
  window.saveCloudState = async function(appState, force = false) {
    if (writingFromSnapshot && !force) return;
    const doSave = async () => {
      try {
        await setDoc(dataRef, {
          ...appState,
          cloudUpdatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (err) {
        console.error('saveCloudState error:', err);
        throw err;
      }
    };
    if (force) {
      clearTimeout(saveTimer);
      await doSave();
    } else {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(doSave, 800);
    }
  };

  // Áp dụng dữ liệu từ cloud, bỏ qua các field Firestore không serialisable
  function applySafe(data) {
    const clean = JSON.parse(JSON.stringify(data, (k, v) => {
      // Bỏ Firestore Timestamp objects
      if (v && typeof v === 'object' && typeof v.toDate === 'function') return v.toDate().toISOString();
      return v;
    }));
    writingFromSnapshot = true;
    window.applyTU2G3CloudState(clean);
    writingFromSnapshot = false;
  }

  // 1. Load ngay khi mở app (đảm bảo điện thoại luôn lấy dữ liệu mới nhất)
  async function loadCloudState() {
    try {
      const snap = await getDoc(dataRef);
      if (snap.exists()) {
        applySafe(snap.data());
        console.log('✅ Đã tải dữ liệu từ Cloud');
      } else {
        console.warn('⚠️ Cloud chưa có dữ liệu. Teamlead cần bấm "Đẩy lên Cloud".');
      }
    } catch (err) {
      console.error('Lỗi tải dữ liệu Cloud:', err);
    }
  }

  // 2. Lắng nghe realtime (onSnapshot) — tự cập nhật khi có thay đổi từ thiết bị khác
  //    Sử dụng includeMetadataChanges:false để chỉ nhận thay đổi từ server (không trigger khi chính mình ghi)
  onSnapshot(dataRef, { includeMetadataChanges: false }, snap => {
    if (!snap.exists()) return;
    // Chỉ áp dụng nếu thay đổi đến từ server (không phải pending local write)
    if (snap.metadata.hasPendingWrites) return;
    applySafe(snap.data());
  }, err => {
    console.error('Lỗi onSnapshot:', err);
  });

  // Khởi động
  loadCloudState();
</script>
